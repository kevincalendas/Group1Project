  <style>
    body {
      margin: 0;
      font-family:  Georgia, Times, 'Times New Roman', serif;
      background-image: url("https://img.freepik.com/premium-vector/elegant-yellow-watercolor-background_205765-201.jpg");
      background-attachment: fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .signup-box {
      background: #fff8dc;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 300px;
      text-align: center;
    }

    .signup-box h2 {
      color: #e6ac00;
      margin-bottom: 15px;
      font-family:  Georgia, Times, 'Times New Roman', serif;
      font-size: 27px;
      animation-name: animatethings;
      animation-duration: 5s;
      animation-iteration-count: infinite;
      animation-fill-mode: forwards;
    }

    .signup-box button {
      width: 95%;
      padding: 6px;
      background: #e6ac00;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .signup-box button:hover {
      background: #cc9900;
    }

    .signup-box a {
      display: block;
      margin-top: 10px;
      font-size: 13px;
      text-decoration: none;
      color: #e6ac00;
    }

    .signup-box input, .button1.sign, .button2{
      width: 90%;
      padding: 8px; 
      margin: 8px 0;
      border: 1px solid #aaa;
      border-radius: 3px;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 2.0);
    }

    .button1:hover, .button2:hover {
      scale: 1.03;
    }

    input:hover {
      scale: 1;
      box-shadow: 0 0 5px rgba(36, 39, 0, 0.616);
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.5);
    }

    .error-message {
      color: #d32f2f;
      font-size: 12px;
      margin-top: 5px;
      display: none;
    }

    .success-message {
      color: #388e3c;
      font-size: 12px;
      margin-top: 5px;
      display: none;
    }

    footer {
      position: absolute;
      bottom: 10px;
      right: 20px;
      font-size: 12px;
      color: #e6ac00;
    }

    @media (max-width: 600px) {
      .signup-box {
        width: 80%;
      }
    }
  </style>
</head>
<body>
  <div class="signup-box">
    <h2>Create Account</h2>

    <form id="signupForm">
      <input id="fullname" type="text" placeholder="Full Name" required>
      <input id="username" type="text" placeholder="Username" required>
      <input id="email" type="email" placeholder="Email" required>
      <input id="password" type="password" placeholder="Password" required>
      <input id="confirmpassword" type="password" placeholder="Confirm Password" required>
      
      <div class="error-message" id="errorMessage"></div>
      <div class="success-message" id="successMessage"></div>
      
      <button type="submit">Sign Up</button>
    </form>

    <p style = "font-weight: bolder;"> <a href="index.html">Already have an account? Login</a> </p>
  </div>

  <footer>
    <p>"2025 Note#Code | All rights reserved."</p>
  </footer>

  <script>
    // Firebase Sign Up Handler
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const fullname = document.getElementById('fullname').value;
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmpassword = document.getElementById('confirmpassword').value;
      const errorDiv = document.getElementById('errorMessage');
      const successDiv = document.getElementById('successMessage');
      
      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';

      // Validate passwords match
      if (password !== confirmpassword) {
        errorDiv.textContent = 'Passwords do not match!';
        errorDiv.style.display = 'block';
        return;
      }

      try {
        // Check if username already exists
        const snapshot = await firebase.database().ref('users').get();
        if (snapshot.exists()) {
          const users = snapshot.val();
          for (const uid in users) {
            if (users[uid].username === username) {
              errorDiv.textContent = 'Username already exists!';
              errorDiv.style.display = 'block';
              return;
            }
          }
        }

        // Create user with Firebase Authentication
        const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;

        // Store user data in Realtime Database
        await firebase.database().ref(`users/${user.uid}`).set({
          uid: user.uid,
          email: email,
          fullname: fullname,
          username: username,
          createdAt: new Date().toISOString()
        });

        successDiv.textContent = 'Account created successfully! Redirecting...';
        successDiv.style.display = 'block';
        
        setTimeout(() => {
          window.location.href = 'login-firebase.html';
        }, 1500);
      } catch (error) {
        errorDiv.textContent = 'Error: ' + error.message;
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
